<svg width="220" height="150" viewBox="0 0 220 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Glowing backdrop blur circle -->
  <circle cx="150" cy="75" r="60" fill="#10b981" opacity="0.15" filter="blur(20px)"/>
  
  <!-- Main Glassmorphic Container Card -->
  <rect x="10" y="10" width="200" height="130" rx="16" fill="#091424" stroke="#1e3a5f" stroke-width="1.5"/>
  <rect x="10" y="10" width="200" height="130" rx="16" fill="url(#glassGrad)" opacity="0.5"/>
  
  <!-- Window Control Buttons -->
  <circle cx="26" cy="24" r="3.5" fill="#ef4444" opacity="0.8"/>
  <circle cx="36" cy="24" r="3.5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="46" cy="24" r="3.5" fill="#10b981" opacity="0.8"/>
  
  <!-- Window Top Line Bar -->
  <line x1="10" y1="36" x2="210" y2="36" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Left Side: Bar Chart & Lines -->
  <rect x="24" y="48" width="40" height="4" rx="2" fill="#334155"/>
  <rect x="24" y="56" width="28" height="3" rx="1.5" fill="#1e293b"/>
  
  <!-- Bar chart bars -->
  <rect x="24" y="94" width="8" height="26" rx="2" fill="#0284c7" opacity="0.7"/>
  <rect x="36" y="82" width="8" height="38" rx="2" fill="#0284c7"/>
  <rect x="48" y="72" width="8" height="48" rx="2" fill="#38bdf8"/>
  <rect x="60" y="86" width="8" height="34" rx="2" fill="#0284c7" opacity="0.8"/>
  <rect x="72" y="66" width="8" height="54" rx="2" fill="#38bdf8"/>
  
  <!-- Sparkline Line across bars -->
  <path d="M20 90 Q35 70 50 65 T80 50" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="80" cy="50" r="3" fill="#38bdf8"/>

  <!-- Right Side: Donut Gauge Chart -->
  <!-- Outer Donut Ring -->
  <circle cx="152" cy="80" r="32" stroke="#1e293b" stroke-width="9" fill="none"/>
  <!-- Primary Segment (Teal/Green) -->
  <circle cx="152" cy="80" r="32" stroke="#10b981" stroke-width="9" fill="none" stroke-dasharray="140 200" stroke-dashoffset="30" stroke-linecap="round"/>
  <!-- Secondary Segment (Cyan) -->
  <circle cx="152" cy="80" r="32" stroke="#06b6d4" stroke-width="9" fill="none" stroke-dasharray="45 200" stroke-dashoffset="-115" stroke-linecap="round"/>
  <!-- Center Text / Icon -->
  <circle cx="152" cy="80" r="22" fill="#0b172b"/>
  <text x="152" y="84" fill="#34d399" font-size="11" font-weight="800" font-family="system-ui, sans-serif" text-anchor="middle">85%</text>

  <!-- Sparkle details -->
  <path d="M195 25 L197 30 L202 32 L197 34 L195 39 L193 34 L188 32 L193 30 Z" fill="#34d399" opacity="0.9"/>
  <path d="M15 125 L16 128 L19 129 L16 130 L15 133 L14 130 L11 129 L14 128 Z" fill="#38bdf8" opacity="0.7"/>

  <defs>
    <linearGradient id="glassGrad" x1="10" y1="10" x2="210" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
</svg>
