<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Dashboard · Expense Tracker AI</title><style>
:root{--ink:#14203d;--muted:#71809c;--line:#e7edf6;--bg:#f7f9fd;--blue:#1263f3;--green:#18af69;--red:#f04545;font-family:Inter,system-ui,sans-serif;color:var(--ink)}*{box-sizing:border-box}body{margin:0;background:var(--bg)}.app{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{padding:22px 14px;background:linear-gradient(150deg,#06255f,#020f2b);color:#fff}.logo{display:flex;gap:10px;align-items:center;font-size:18px;font-weight:800;line-height:1.1;margin:0 5px 30px}.logo img{width:38px;height:38px;border-radius:10px}.side a{display:block;margin:5px 0;padding:12px;border-radius:9px;color:#e9f0ff;text-decoration:none;font-weight:650}.side a:first-of-type{background:#1050b7}.main{padding:22px 28px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.top h1{margin:0;font-size:24px}.top p{margin:5px 0;color:var(--muted)}.month{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff;font:inherit}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:20px 0 16px}.card{padding:18px;border:1px solid var(--line);border-radius:13px;background:#fff;box-shadow:0 3px 10px #2036660a}.metric small,.muted{color:var(--muted)}.metric b{display:block;margin:8px 0;font-size:23px}.metric span{color:var(--green);font-size:12px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:15px}.card h2{margin:0;font-size:15px}.budget{display:flex;gap:25px;align-items:center;margin-top:18px}.ring{display:grid;place-items:center;width:125px;height:125px;border-radius:50%;padding:10px;background:conic-gradient(#1263f3 var(--used,0%),#e8edf5 0)}.ring div{display:grid;place-content:center;width:100%;height:100%;border-radius:50%;background:#fff;text-align:center;font-size:24px;font-weight:800}.ring small{font-size:11px;color:var(--muted)}.budget p{line-height:1.5;color:var(--muted)}.list{padding:0;margin:14px 0 0;list-style:none}.list li{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}.dot{width:9px;height:9px;border-radius:50%;background:#1263f3}.bar{height:8px;border-radius:99px;background:#e7edf5;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;border-radius:inherit;background:#1263f3}.transactions{margin-top:15px;border-collapse:collapse;width:100%;font-size:13px}.transactions th,.transactions td{padding:12px 8px;text-align:left;border-bottom:1px solid var(--line)}.transactions th{color:var(--muted);font-size:11px;text-transform:uppercase}.amount{text-align:right;font-weight:750}.error{max-width:500px;margin:15vh auto;padding:25px;border-radius:14px;background:#fff;border:1px solid var(--line)}@media(max-width:800px){.app{display:block}.side{display:none}.main{padding:16px 12px}.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:420px){.metrics{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><main id="app" class="error">Loading your private dashboard…</main><script>
const app=document.getElementById('app');const params=new URLSearchParams(location.search);const token=params.get('dashboard_token');const month=params.get('month')||new Date().toISOString().slice(0,7);
const money=(n,c)=>new Intl.NumberFormat('en-US',{style:'currency',currency:c}).format((n||0)/100);
async function load(){const query=new URLSearchParams({month});if(token)query.set('dashboard_token',token);const r=await fetch('/api/dashboard?'+query,{credentials:'same-origin'});if(!r.ok)throw new Error((await r.json()).error||'Unable to open dashboard');if(token)history.replaceState({},'',location.pathname+'?month='+month);return r.json()}
function render(d){const used=d.budgetMinor?Math.round(d.spentMinor/d.budgetMinor*100):0,remaining=d.budgetMinor===null?null:d.budgetMinor-d.spentMinor;const cats=d.categories.map((x,i)=>`<li><i class="dot" style="background:${['#ff5948','#1769e8','#ffb20d','#32bf68','#8c5de8'][i%5]}"></i><span>${x.name}</span><b>${money(x.amountMinor,d.currency)}</b></li>`).join('')||'<li>No expenses yet.</li>';const tx=d.expenses.map(x=>`<tr><td>${x.date}</td><td>${x.category}</td><td>${x.description||'Expense'}</td><td class="amount">−${money(x.amountMinor,d.currency)}</td></tr>`).join('')||'<tr><td colspan="4">No transactions yet.</td></tr>';app.className='app';app.innerHTML=`<aside class="side"><div class="logo"><img src="/assets/logo/icon-512.png" alt="">Expense<br>Tracker AI</div><a href="#dashboard">⌂　Dashboard</a><a href="#transactions">▤　Transactions</a><a href="#budget">◉　Budget</a><a href="#categories">⊞　Categories</a></aside><section class="main" id="dashboard"><header class="top"><div><h1>Dashboard</h1><p>Your private financial overview for ${d.month}.</p></div><input class="month" type="month" value="${d.month}" onchange="location.search='month='+this.value"></header><section class="metrics"><article class="card metric"><small>Total balance</small><b>${money(d.incomeMinor-d.spentMinor,d.currency)}</b><span>Income minus expenses</span></article><article class="card metric"><small>Total income</small><b>${money(d.incomeMinor,d.currency)}</b><span>Recorded this month</span></article><article class="card metric"><small>Total expenses</small><b>${money(d.spentMinor,d.currency)}</b><span>Monthly spend</span></article><article class="card metric"><small>Monthly savings</small><b>${money(d.incomeMinor-d.spentMinor,d.currency)}</b><span>${d.incomeMinor?Math.round((d.incomeMinor-d.spentMinor)/d.incomeMinor*100):0}% savings rate</span></article></section><section class="grid"><article class="card" id="budget"><h2>Budget Overview</h2><div class="budget"><div class="ring" style="--used:${Math.min(100,used)}%"><div>${d.budgetMinor?used+'%':'—'}<small>used</small></div></div><div><b>${d.budgetMinor?money(d.budgetMinor,d.currency):'No overall budget'}</b><p>${remaining===null?'Set a budget in MCP to track progress.':remaining<0?money(Math.abs(remaining),d.currency)+' over budget.':money(remaining,d.currency)+' remaining this month.'}</p></div></div></article><article class="card" id="categories"><h2>Expense by Category</h2><ul class="list">${cats}</ul></article></section><article class="card" id="transactions" style="margin-top:15px"><h2>Recent Transactions</h2><table class="transactions"><thead><tr><th>Date</th><th>Category</th><th>Description</th><th class="amount">Amount</th></tr></thead><tbody>${tx}</tbody></table></article></section>`}
load().then(render).catch(e=>app.innerHTML='<h1>Dashboard unavailable</h1><p>'+e.message+'</p><p>Open a fresh dashboard link from Expense Tracker MCP.</p>');
</script></body></html>
