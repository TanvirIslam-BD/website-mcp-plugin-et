<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
  <title>Dashboard · Expense Tracker AI</title>
  <style>
    :root{--ink:#12224a;--muted:#7180a0;--canvas:#f5f8ff;--surface:#fff;--line:#e4ebf6;--blue:#1769f6;--cyan:#32b7ec;--green:#16b86a;--amber:#ffb21b;--red:#f4554b;--violet:#8658ed;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
    *{box-sizing:border-box} body{margin:0;background:var(--canvas);min-width:320px}.app{min-height:100vh;display:grid;grid-template-columns:244px 1fr}.side{position:sticky;top:0;height:100vh;padding:25px 14px;background:radial-gradient(circle at 18% 3%,#155fd0 0,#092a6d 27%,#041534 70%);color:#fff;overflow:auto}.brand{display:flex;align-items:center;gap:11px;margin:2px 8px 36px;font-size:19px;font-weight:800;line-height:1.03;letter-spacing:-.35px}.brand img{width:42px;height:42px;border-radius:12px;box-shadow:0 9px 24px #0005}.nav{display:grid;gap:7px}.nav a{display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:10px;color:#d7e5ff;text-decoration:none;font-size:14px;font-weight:700;transition:.2s}.nav a:hover,.nav a:first-child{background:linear-gradient(100deg,#256ef0,#1457c7);box-shadow:0 7px 18px #0002;color:#fff}.nav svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none}.side-help{position:absolute;bottom:25px;left:14px;right:14px;padding:15px;border:1px solid #ffffff24;border-radius:14px;background:#ffffff0a;color:#bcd2ff;font-size:12px;line-height:1.55}.side-help b{display:block;color:#fff;font-size:13px;margin-bottom:4px}.main{padding:30px clamp(18px,3vw,46px) 48px;max-width:1700px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:25px}.eyebrow{margin:0 0 7px;color:var(--blue);font-weight:800;font-size:12px;letter-spacing:.09em;text-transform:uppercase}.top h1{margin:0;font-size:30px;letter-spacing:-1px}.top p{margin:7px 0 0;color:var(--muted);font-size:14px}.month{height:44px;padding:0 14px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);box-shadow:0 4px 16px #1838700a;font:600 14px inherit}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:18px}.card{border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:0 10px 30px #17376c0a}.metric{min-height:146px;padding:20px;position:relative;overflow:hidden}.metric:before{content:"";position:absolute;right:-20px;bottom:-29px;width:95px;height:95px;border-radius:50%;background:var(--soft,#eaf1ff)}.metric small{display:block;color:var(--muted);font-size:13px;font-weight:600}.metric b{display:block;margin:11px 0 9px;font-size:24px;line-height:1.1;letter-spacing:-.7px;position:relative}.metric span{color:var(--trend,var(--green));font-size:12px;font-weight:700;position:relative}.metric .icon{position:absolute;right:19px;top:19px;width:39px;height:39px;display:grid;place-items:center;border-radius:12px;color:var(--accent,var(--blue));background:var(--soft,#eaf1ff);z-index:1}.metric svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none}.overview{display:grid;grid-template-columns:minmax(330px,.92fr) minmax(0,1.25fr);gap:18px;margin-bottom:18px}.panel{padding:22px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.panel h2{margin:0;font-size:16px;letter-spacing:-.2px}.panel-sub{color:var(--muted);font-size:12px;font-weight:600}.budget-inner{display:flex;align-items:center;gap:27px;padding:22px 2px 14px}.ring{--used:0%;width:156px;height:156px;padding:11px;border-radius:50%;background:conic-gradient(from -45deg,var(--ring,#1769f6) var(--used),#edf1f8 0);display:grid;place-items:center;flex:none;position:relative}.ring:after{content:"";position:absolute;inset:5px;border-radius:50%;border:1px solid #fff8}.ring>div{position:relative;z-index:1;width:100%;height:100%;border-radius:50%;display:grid;place-content:center;text-align:center;background:white;box-shadow:inset 0 0 0 1px var(--line)}.ring b{font-size:29px;letter-spacing:-1px}.ring small{color:var(--muted);font-weight:700;font-size:11px}.budget-copy{flex:1}.budget-copy .budget-money{font-size:23px;font-weight:800;letter-spacing:-.5px}.budget-copy p{color:var(--muted);line-height:1.55;margin:7px 0 13px;font-size:13px}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:750;background:#fff1f0;color:#e8463d}.pill.good{background:#eafbf2;color:#0c9a56}.progress{height:9px;border-radius:99px;background:#e9eef7;overflow:hidden}.progress i{display:block;height:100%;width:var(--used);border-radius:inherit;background:linear-gradient(90deg,var(--green),var(--amber),var(--red))}.trend{padding-bottom:10px}.chart{height:204px;margin:13px 0 0;position:relative;background:linear-gradient(#edf2fa 1px,transparent 1px) 0 0/100% 51px}.chart svg{width:100%;height:100%;overflow:visible}.chart path.area{fill:url(#area)}.chart path.line{fill:none;stroke:var(--blue);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.chart .point{fill:#fff;stroke:var(--blue);stroke-width:3}.chart-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;font-weight:650;margin-top:6px}.category-row{display:grid;grid-template-columns:minmax(110px,1fr) minmax(90px,2.3fr) auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.category-row:last-child{border:0}.cat-name{display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}.cat-bar{height:8px;border-radius:99px;background:#edf1f7;overflow:hidden}.cat-bar i{display:block;width:var(--w);height:100%;border-radius:inherit;background:var(--c)}.cat-money{font-weight:800;white-space:nowrap}.bottom{display:grid;grid-template-columns:1.55fr .85fr;gap:18px}.transactions{width:100%;border-collapse:collapse;margin-top:13px;font-size:13px}.transactions th{padding:11px 9px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em;text-align:left}.transactions td{padding:13px 9px;border-top:1px solid var(--line)}.transactions td:first-child{color:var(--muted)}.tag{display:inline-flex;background:#edf4ff;color:#2768c8;border-radius:7px;padding:5px 8px;text-transform:capitalize;font-weight:700;font-size:11px}.amount{text-align:right;font-weight:800;color:#d94b45}.insight{margin-top:15px;padding:16px;border-radius:12px;background:linear-gradient(130deg,#eef5ff,#f6efff);border:1px solid #dbe7ff}.insight b{display:block;margin-bottom:6px;font-size:13px}.insight p{margin:0;color:#556889;font-size:12px;line-height:1.55}.empty{color:var(--muted);padding:20px 0;font-size:13px}.error{max-width:480px;margin:15vh auto;padding:28px;border-radius:16px;background:#fff;border:1px solid var(--line);box-shadow:0 12px 40px #17376c12}.error h1{margin-top:0}@media(max-width:1100px){.app{grid-template-columns:78px 1fr}.side{padding:22px 10px}.brand{margin:0 8px 32px}.brand span,.nav span,.side-help{display:none}.nav a{justify-content:center;padding:13px}.overview,.bottom{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.app{display:block}.side{position:static;height:auto;padding:12px;display:flex;align-items:center;justify-content:space-between}.brand{margin:0;font-size:0}.brand img{width:36px;height:36px}.nav{display:flex;gap:3px}.nav a{padding:9px}.main{padding:22px 14px}.top{align-items:flex-start;flex-direction:column}.top h1{font-size:26px}.month{width:100%}.metrics{grid-template-columns:1fr 1fr;gap:10px}.metric{min-height:125px;padding:16px}.metric b{font-size:19px}.metric .icon{display:none}.overview{gap:12px}.panel{padding:17px}.budget-inner{gap:17px}.ring{width:125px;height:125px}.ring b{font-size:23px}.category-row{grid-template-columns:minmax(70px,1fr) minmax(55px,1.2fr) auto;gap:7px}.transactions th:nth-child(1),.transactions td:nth-child(1){display:none}.transactions{font-size:12px}.transactions th,.transactions td{padding-left:4px;padding-right:4px}}@media(max-width:390px){.metrics{grid-template-columns:1fr}.budget-inner{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body><main id="app" class="error">Loading your private dashboard…</main>
<script>
const app=document.getElementById('app'),colors=['#f4554b','#1769f6','#ffb21b','#16b86a','#8658ed','#30afd9'];
const params=new URLSearchParams(location.search),token=params.get('dashboard_token'),month=params.get('month')||new Date().toISOString().slice(0,7);
const esc=value=>String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const money=(n,c)=>new Intl.NumberFormat('en-US',{style:'currency',currency:c,maximumFractionDigits:2}).format((n||0)/100);
const icon={wallet:'<svg viewBox="0 0 24 24"><path d="M3 7h15a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h12"/><path d="M16 14h.01"/></svg>',down:'<svg viewBox="0 0 24 24"><path d="M12 3v14"/><path d="m6 11 6 6 6-6"/></svg>',up:'<svg viewBox="0 0 24 24"><path d="M12 21V7"/><path d="m6 13 6-6 6 6"/></svg>',piggy:'<svg viewBox="0 0 24 24"><path d="M19 8h2v4h-2"/><path d="M4 8 2 6m3 10v3m10-3v3m-5-13c2-2 6-1 7 2 2 0 3 2 3 4 0 4-4 7-9 7s-9-3-9-7c0-3 2-5 5-6 0-2 2-3 4-3"/><path d="M9 12h.01"/></svg>'};
async function load(){const q=new URLSearchParams({month});if(token)q.set('dashboard_token',token);const r=await fetch('/api/dashboard?'+q,{credentials:'same-origin'});if(!r.ok)throw new Error((await r.json()).error||'Unable to open dashboard');if(token)history.replaceState({},'',location.pathname+'?month='+month);return r.json()}
function render(d){const used=d.budgetMinor?Math.round(d.spentMinor/d.budgetMinor*100):0,limitedUsed=Math.min(100,Math.max(0,used)),remaining=d.budgetMinor===null?null:d.budgetMinor-d.spentMinor,top=Math.max(...d.categories.map(x=>x.amountMinor),1),savings=d.incomeMinor-d.spentMinor,rate=d.incomeMinor?Math.round(savings/d.incomeMinor*100):0;const over=remaining!==null&&remaining<0;
const cats=d.categories.slice(0,8).map((x,i)=>{const color=colors[i%colors.length];return `<div class="category-row"><span class="cat-name"><i class="dot" style="--c:${color}"></i>${esc(x.name)}</span><span class="cat-bar"><i style="--w:${Math.round(x.amountMinor/top*100)}%;--c:${color}"></i></span><b class="cat-money">${money(x.amountMinor,d.currency)}</b></div>`}).join('')||'<div class="empty">No expenses recorded for this month.</div>';
const tx=d.expenses.slice(0,7).map(x=>`<tr><td>${esc(x.date)}</td><td><span class="tag">${esc(x.category)}</span></td><td>${esc(x.description||'Expense')}</td><td class="amount">−${money(x.amountMinor,d.currency)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No transactions yet.</td></tr>';
const points=d.categories.slice(0,7).map((x,i)=>`${10+i*14},${174-Math.round(x.amountMinor/top*130)}`).join(' ');const area=`M10,190 L${points.replaceAll(' ',', L')} L94,190 Z`;
app.className='app';app.innerHTML=`<aside class="side"><div class="brand"><img src="/assets/logo/icon-512.png" alt="Expense Tracker AI"><span>Expense<br>Tracker AI</span></div><nav class="nav"><a href="#dashboard"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v10H3z"/><path d="M9 21v-6h6v6"/></svg><span>Dashboard</span></a><a href="#transactions"><svg viewBox="0 0 24 24"><path d="M5 3h14v18H5z"/><path d="M8 7h8M8 11h8M8 15h5"/></svg><span>Transactions</span></a><a href="#budget"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10m3-7.5c0-1.2-1.3-2-3-2s-3 .8-3 2 1.3 2 3 2 3 .8 3 2-1.3 2-3 2-3-.8-3-2"/></svg><span>Budget</span></a><a href="#categories"><svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zm10 0h6v6h-6zM4 14h6v6H4zm10 0h6v6h-6z"/></svg><span>Categories</span></a></nav><div class="side-help"><b>Private workspace</b>Your financial data is loaded only through your signed dashboard session.</div></aside><section class="main" id="dashboard"><header class="top"><div><p class="eyebrow">Expense Tracker AI</p><h1>Good to see you</h1><p>Your private financial overview for ${esc(d.month)}.</p></div><input class="month" aria-label="Select month" type="month" value="${esc(d.month)}" onchange="location.search='month='+this.value"></header><section class="metrics"><article class="card metric" style="--accent:#1769f6;--soft:#eaf1ff"><span class="icon">${icon.wallet}</span><small>Total balance</small><b>${money(savings,d.currency)}</b><span>Income minus expenses</span></article><article class="card metric" style="--accent:#16b86a;--soft:#e8fbf0"><span class="icon">${icon.down}</span><small>Total income</small><b>${money(d.incomeMinor,d.currency)}</b><span>Recorded this month</span></article><article class="card metric" style="--accent:#f4554b;--soft:#fff0ef;--trend:#e2453d"><span class="icon">${icon.up}</span><small>Total expenses</small><b>${money(d.spentMinor,d.currency)}</b><span>Monthly spend</span></article><article class="card metric" style="--accent:#8658ed;--soft:#f2edff;--trend:${savings>=0?'#16a861':'#e2453d'}"><span class="icon">${icon.piggy}</span><small>Monthly savings</small><b>${money(savings,d.currency)}</b><span>${rate}% savings rate</span></article></section><section class="overview"><article class="card panel" id="budget"><div class="panel-head"><h2>Budget overview</h2><span class="panel-sub">${d.budgetMinor?esc(d.month):'Set a limit'}</span></div><div class="budget-inner"><div class="ring" style="--used:${limitedUsed}%;--ring:${over?'#f4554b':'#1769f6'}"><div><b>${d.budgetMinor?used+'%':'—'}</b><small>${d.budgetMinor?'used':'no budget'}</small></div></div><div class="budget-copy"><div class="budget-money">${d.budgetMinor?money(d.budgetMinor,d.currency):'No overall budget'}</div><p>${remaining===null?'Set an overall budget in Expense Tracker MCP to see your progress.':over?money(Math.abs(remaining),d.currency)+' over budget this month.':money(remaining,d.currency)+' remaining this month.'}</p>${remaining===null?'':`<div class="progress" style="--used:${limitedUsed}%"><i></i></div><span class="pill ${over?'':'good'}">${over?'Budget exceeded':'On track'}</span>`}</div></div></article><article class="card panel trend"><div class="panel-head"><h2>Spending snapshot</h2><span class="panel-sub">Top categories</span></div><div class="chart"><svg viewBox="0 0 100 200" preserveAspectRatio="none" aria-label="Spending pattern"><defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1769f6" stop-opacity=".24"/><stop offset="1" stop-color="#1769f6" stop-opacity="0"/></linearGradient></defs><path class="area" d="${area}"/><polyline class="line" points="${points}"/>${d.categories.slice(0,7).map((x,i)=>{const y=174-Math.round(x.amountMinor/top*130);return `<circle class="point" cx="${10+i*14}" cy="${y}" r="2.3"/>`}).join('')}</svg></div><div class="chart-labels"><span>Highest</span><span>Category mix</span><span>Lowest</span></div></article></section><section class="bottom"><article class="card panel" id="transactions"><div class="panel-head"><h2>Recent transactions</h2><span class="panel-sub">Latest activity</span></div><table class="transactions"><thead><tr><th>Date</th><th>Category</th><th>Description</th><th class="amount">Amount</th></tr></thead><tbody>${tx}</tbody></table></article><article class="card panel" id="categories"><div class="panel-head"><h2>Expense by category</h2><span class="panel-sub">${d.categories.length} categories</span></div>${cats}<div class="insight"><b>Smart focus</b><p>${d.categories[0]?`${esc(d.categories[0].name)} is your largest expense category at ${money(d.categories[0].amountMinor,d.currency)} this month.`:'Add expenses to receive category insights.'}</p></div></article></section></section>`}
load().then(render).catch(e=>app.innerHTML=`<h1>Dashboard unavailable</h1><p>${esc(e.message)}</p><p>Open a fresh dashboard link from Expense Tracker MCP.</p>`);
</script></body></html>
