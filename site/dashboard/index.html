    .side{position:sticky;top:0;height:100vh;padding:25px 13px;background:radial-gradient(circle at 8% 0,#162c72,#051434 57%,#020c25);color:#fff}.brand{display:flex;align-items:center;gap:11px;margin:0 13px 34px;font-size:18px;font-weight:850;line-height:1.03;letter-spacing:-.5px}.brand span em{display:block;color:#5c86ff;font-style:normal}.brand img{width:43px;height:43px;border-radius:12px;box-shadow:0 10px 26px #0008}.nav{display:grid;gap:6px}.nav a{display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:10px;color:#e4edff;text-decoration:none;font-size:13px;font-weight:700}.nav a:hover,.nav a:first-child{background:linear-gradient(105deg,#3d68ff,#2749d9);box-shadow:0 9px 20px #0004}.nav svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none}.streak{position:absolute;bottom:94px;left:13px;right:13px;padding:16px;border:1px solid #ffffff1e;border-radius:13px;background:#ffffff08;font-size:12px;color:#c4d2ff}.streak b{display:block;color:#fff;font-size:17px;margin:6px 0}.streak .mini-bar{display:flex;gap:4px;margin-top:12px}.mini-bar i{height:6px;flex:1;border-radius:9px;background:#42d79a}.profile{position:absolute;bottom:20px;left:13px;right:13px;display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #ffffff1b;border-radius:12px;color:#fff;font-size:12px}.profile img{width:34px;height:34px;border-radius:50%;object-fit:cover}.profile b{display:block}.profile small{color:#8ba9e7}

    .analysis{display:grid;grid-template-columns:340px minmax(0,1fr) 296px;gap:13px;margin-bottom:14px}.panel{padding:16px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.panel h2{margin:0;font-size:14px;letter-spacing:-.25px}.link{border:0;background:none;color:var(--blue);font:700 11px inherit;cursor:pointer}.health{display:flex;align-items:center;gap:22px;padding-top:20px}.score{--score:70%;width:146px;height:146px;border-radius:50%;padding:10px;background:conic-gradient(var(--green) var(--score),#eaf2f0 0);display:grid;place-items:center}.score>div{width:100%;height:100%;border-radius:50%;background:#fff;display:grid;place-content:center;text-align:center}.score b{font-size:34px}.score small{color:var(--muted);font-weight:700}.health-list{display:grid;gap:14px;font-size:11px}.health-list div{display:flex;justify-content:space-between;gap:13px;color:var(--muted)}.health-list b{color:var(--ink)}.health-list .ok{color:var(--green)}.income-chart{height:202px;margin-top:13px;position:relative;background:linear-gradient(#edf1f8 1px,transparent 1px) 0 0/100% 50px}.income-chart svg{width:100%;height:100%;overflow:visible}.income-chart .expense,.income-chart .income{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.income-chart .expense{stroke:var(--red)}.income-chart .income{stroke:var(--green)}.legend{display:flex;gap:17px;color:var(--muted);font-size:10px;font-weight:650}.legend i{display:inline-block;width:12px;height:2px;vertical-align:middle;margin-right:5px;background:var(--green)}.legend i.red{background:var(--red)}.budget-gauge{--used:0%;width:142px;height:142px;margin:14px auto 8px;padding:10px;border-radius:50%;background:conic-gradient(from -45deg,var(--red) var(--used),#f8e4e6 0);display:grid;place-items:center}.budget-gauge>div{width:100%;height:100%;border-radius:50%;background:#fff;display:grid;place-content:center;text-align:center}.budget-gauge b{font-size:28px}.budget-gauge small{font-size:10px;color:var(--muted);font-weight:700}.budget-values{display:flex;justify-content:space-between;text-align:center;font-size:10px;color:var(--muted)}.budget-values b{display:block;color:var(--ink);font-size:12px;margin-top:3px}.budget-alert{margin-top:14px;padding:8px 10px;border-radius:8px;background:#fff0f0;color:#e84141;font-size:10px;font-weight:750}
    .lower{display:grid;grid-template-columns:340px minmax(0,1fr) 296px;gap:13px;margin-bottom:14px}.donut-row{display:flex;gap:17px;align-items:center;padding:17px 0 10px}.donut{--a:34%;--b:56%;--c:73%;--d:86%;width:139px;height:139px;border-radius:50%;background:conic-gradient(#ff504f 0 var(--a),#7d48f7 var(--a) var(--b),#ffb116 var(--b) var(--c),#287bcc var(--c) var(--d),#dce4f1 var(--d) 100%);padding:25px;flex:none}.donut>div{width:100%;height:100%;display:grid;place-content:center;text-align:center;border-radius:50%;background:#fff}.donut b{font-size:18px}.donut small{font-size:9px;color:var(--muted)}.category-key{display:grid;gap:9px;font-size:10px;flex:1}.category-key span{display:flex;align-items:center;justify-content:space-between;gap:7px}.dot{width:7px;height:7px;border-radius:50%;background:var(--c);display:inline-block;margin-right:5px}.insights{padding:5px 0}.insight{display:flex;gap:9px;padding:10px 0;border-bottom:1px solid var(--line);font-size:11px;line-height:1.35}.insight:last-child{border:0}.insight i{width:25px;height:25px;flex:none;border-radius:8px;background:#eff4ff;display:grid;place-items:center;font-style:normal}.insight b{display:block}.goals{display:grid;gap:10px;margin-top:10px}.goal{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:9px;border:1px solid var(--line);border-radius:9px}.goal-art{border-radius:7px;background:linear-gradient(135deg,#7be1f9,#3069dd);display:grid;place-items:center;font-size:23px}.goal b{font-size:11px}.goal small{display:block;color:var(--muted);font-size:10px;margin:3px 0 7px}.progress{height:6px;border-radius:9px;background:#edf1f7;overflow:hidden}.progress i{display:block;height:100%;width:var(--value);border-radius:inherit;background:linear-gradient(90deg,#16bd6a,#58df99)}.stack{display:grid;gap:13px}.compact-list{padding:7px 0 0}.compact-row{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:11px}.compact-row:last-child{border:0}.compact-row i{width:21px;height:21px;border-radius:7px;background:#fff1df;display:grid;place-items:center;font-style:normal}.compact-row small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.compact-row b{font-size:11px}.recent{padding:15px 17px}.transactions{width:100%;border-collapse:collapse;margin-top:10px;font-size:11px}.transactions th{text-align:left;padding:8px;color:var(--muted);font-size:9px;text-transform:uppercase}.transactions td{padding:10px 8px;border-top:1px solid var(--line)}.transactions td:first-child{color:var(--muted)}.tag{display:inline-block;padding:4px 7px;border-radius:6px;background:#edf3ff;color:#3565c7;font-weight:750;text-transform:capitalize}.amount{text-align:right;font-weight:800;color:var(--red)}.empty{color:var(--muted);font-size:11px;padding:16px 0}.error{max-width:480px;margin:16vh auto;padding:28px;background:#fff;border-radius:14px;border:1px solid var(--line)}
    @media(max-width:1250px){.analysis,.lower{grid-template-columns:310px 1fr}.analysis>article:last-child,.lower>.stack{grid-column:1/-1}.stack{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:repeat(2,1fr)}.metric.hero{grid-column:auto}}@media(max-width:940px){.app{grid-template-columns:72px 1fr}.side{padding:20px 8px}.brand{margin:0 6px 28px}.brand span,.nav span,.streak,.profile{display:none}.nav a{justify-content:center;padding:12px}.analysis,.lower{grid-template-columns:1fr}.stack{grid-template-columns:1fr}.main{padding:20px 14px}.search{display:none}}@media(max-width:600px){.app{display:block}.side{position:static;height:auto;display:flex;align-items:center;justify-content:space-between;padding:12px}.brand{margin:0;font-size:0}.brand img{width:36px;height:36px}.nav{display:flex}.nav a{padding:9px}.metrics{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.actions{width:100%;flex-wrap:wrap}.month{flex:1}.button{flex:1}.notify{display:none}.health{justify-content:center}.transactions th:nth-child(1),.transactions td:nth-child(1),.transactions th:nth-child(4),.transactions td:nth-child(4){display:none}}
    .modal-backdrop{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:18px;background:#08143188;backdrop-filter:blur(5px)}.modal{width:min(470px,100%);padding:22px;border-radius:17px;background:#fff;box-shadow:0 24px 80px #00123b55}.modal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.modal h2{margin:0;font-size:19px}.modal-close{border:0;background:#f0f3fa;border-radius:8px;width:31px;height:31px;font-size:18px;cursor:pointer}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px;margin-bottom:12px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:750;color:var(--muted)}.field input,.field select{width:100%;height:41px;border:1px solid var(--line);border-radius:8px;padding:0 10px;color:var(--ink);font:600 13px inherit;background:#fff}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:8px}.form-error{min-height:17px;margin:3px 0 0;color:#e23b41;font-size:11px;font-weight:700}
  </style>

<body><main id="app" class="error">Loading your private dashboard…</main>
<script>
const app=document.getElementById('app'),q=new URLSearchParams(location.search),token=q.get('dashboard_token'),month=q.get('month')||new Date().toISOString().slice(0,7),colors=['#ff504f','#7d48f7','#ffb116','#287bcc','#48b67a'];
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const money=(n,c)=>new Intl.NumberFormat('en-US',{style:'currency',currency:c,maximumFractionDigits:2}).format((n||0)/100);
const svgIcon={wallet:'<svg viewBox="0 0 24 24"><path d="M3 7h15a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h12"/><path d="M16 14h.01"/></svg>',down:'<svg viewBox="0 0 24 24"><path d="M12 3v14"/><path d="m6 11 6 6 6-6"/></svg>',up:'<svg viewBox="0 0 24 24"><path d="M12 21V7"/><path d="m6 13 6-6 6 6"/></svg>',piggy:'<svg viewBox="0 0 24 24"><path d="M19 8h2v4h-2"/><path d="M4 8 2 6m3 10v3m10-3v3m-5-13c2-2 6-1 7 2 2 0 3 2 3 4 0 4-4 7-9 7s-9-3-9-7c0-3 2-5 5-6 0-2 2-3 4-3"/><path d="M9 12h.01"/></svg>'};
async function load(){const p=new URLSearchParams({month});if(token)p.set('dashboard_token',token);const r=await fetch('/api/dashboard?'+p,{credentials:'same-origin'});if(!r.ok)throw new Error((await r.json()).error||'Unable to open dashboard');if(token)history.replaceState({},'',location.pathname+'?month='+month);return r.json()}
window.filterTransactions=value=>{const query=String(value||'').toLowerCase();document.querySelectorAll('#transactions tbody tr').forEach(row=>{row.style.display=row.textContent.toLowerCase().includes(query)?'':'none'})};
window.closeEntry=()=>document.getElementById('entry-modal')?.remove();
window.openEntry=kind=>{const income=kind==='income',today=new Date().toISOString().slice(0,10);document.body.insertAdjacentHTML('beforeend',`<div class="modal-backdrop" id="entry-modal" role="dialog" aria-modal="true"><form class="modal" onsubmit="submitEntry(event,'${kind}')"><div class="modal-top"><h2>Add ${income?'income':'expense'}</h2><button type="button" class="modal-close" onclick="closeEntry()">×</button></div><div class="form-grid"><div class="field"><label>Amount</label><input name="amount" inputmode="decimal" placeholder="0.00" required></div><div class="field"><label>Date</label><input name="date" type="date" value="${today}" required></div><div class="field"><label>${income?'Source':'Category'}</label><input name="category" placeholder="${income?'Salary, freelance…':'Food, travel…'}" required></div><div class="field"><label>Currency</label><input name="currency" value="BDT" maxlength="3" required></div><div class="field full"><label>${income?'Notes':'Description'}</label><input name="description" placeholder="Optional details"></div></div><p class="form-error" id="entry-error"></p><div class="modal-actions"><button type="button" class="button" onclick="closeEntry()">Cancel</button><button class="button primary" type="submit">Save ${income?'income':'expense'}</button></div></form></div>`) };
window.submitEntry=async(event,kind)=>{event.preventDefault();const form=new FormData(event.currentTarget),payload={kind,amount:form.get('amount'),date:form.get('date'),category:form.get('category'),source:form.get('category'),currency:String(form.get('currency')).toUpperCase(),description:form.get('description')},error=document.getElementById('entry-error');try{const r=await fetch('/api/dashboard',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),body=await r.json();if(!r.ok)throw new Error(body.error||'Could not save this entry.');location.reload()}catch(err){error.textContent=err.message}};
window.submitBudget=async event=>{event.preventDefault();const f=new FormData(event.currentTarget),error=document.getElementById('entry-error');try{const r=await fetch('/api/dashboard',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:'budget',amount:f.get('amount'),currency:String(f.get('currency')).toUpperCase()})}),body=await r.json();if(!r.ok)throw new Error(body.error||'Could not save budget.');location.reload()}catch(err){error.textContent=err.message}};
window.submitGoal=async event=>{event.preventDefault();const f=new FormData(event.currentTarget),error=document.getElementById('entry-error');try{const r=await fetch('/api/dashboard',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:'goal',name:f.get('name'),target:f.get('target'),currency:String(f.get('currency')).toUpperCase()})}),body=await r.json();if(!r.ok)throw new Error(body.error||'Could not save goal.');location.reload()}catch(err){error.textContent=err.message}};
window.openPanel=kind=>{const d=window.dashboardData;if(!d)return;const rows=(items,fn)=>items.length?items.map(fn).join(''):'<div class="empty">Nothing to show yet.</div>';let title='Details',content='';if(kind==='categories'){title='All spending categories';content=rows(d.categories,x=>`<div class="compact-row"><i>●</i><span>${esc(x.name)}<small>${Math.round(x.amountMinor/d.spentMinor*100)||0}% of spending</small></span><b>${money(x.amountMinor,d.currency)}</b></div>`)}else if(kind==='transactions'){title='All recent transactions';content=rows(d.expenses,x=>`<div class="compact-row"><i>−</i><span>${esc(x.description||'Expense')}<small>${esc(x.date)} · ${esc(x.category)}</small></span><b>${money(x.amountMinor,d.currency)}</b></div>`)}else if(kind==='bills'){title='Upcoming recurring bills';content=rows(d.recurring||[],x=>`<div class="compact-row"><i>↻</i><span>${esc(x.merchant||x.description||x.category)}<small>${esc(x.nextDate||'Scheduled')} · ${esc(x.frequency)}</small></span><b>${money(x.amountMinor,d.currency)}</b></div>`)}else if(kind==='analysis'){title='Financial analysis';content=`<div class="insights"><div class="insight"><i>◎</i><span><b>${d.categories[0]?esc(d.categories[0].name)+' is your biggest category':'Start tracking expenses'}</b>${d.categories[0]?money(d.categories[0].amountMinor,d.currency)+' is your highest category this month.':'Add an expense to begin.'}</span></div><div class="insight"><i>◷</i><span><b>${(d.recurring||[]).length} recurring bill${(d.recurring||[]).length===1?'':'s'}</b>Review each recurring charge before its next due date.</span></div></div>`}else if(kind==='budget'){title='Set monthly budget';content=`<form onsubmit="submitBudget(event)"><div class="form-grid"><div class="field"><label>Monthly limit</label><input name="amount" inputmode="decimal" value="${d.budgetMinor?(d.budgetMinor/100).toFixed(2):''}" required></div><div class="field"><label>Currency</label><input name="currency" value="${esc(d.currency)}" maxlength="3" required></div></div><p class="form-error" id="entry-error"></p><div class="modal-actions"><button class="button primary">Save budget</button></div></form>`}else if(kind==='goals'){const goal=d.goals?.[0];title='Savings goal';content=`<form onsubmit="submitGoal(event)"><div class="form-grid"><div class="field full"><label>Goal name</label><input name="name" value="${esc(goal?.name||'Savings goal')}" required></div><div class="field"><label>Target amount</label><input name="target" inputmode="decimal" value="${goal?.targetMinor?(goal.targetMinor/100).toFixed(2):''}" required></div><div class="field"><label>Currency</label><input name="currency" value="${esc(d.currency)}" maxlength="3" required></div></div><p class="form-error" id="entry-error"></p><div class="modal-actions"><button class="button primary">Save goal</button></div></form>`};document.body.insertAdjacentHTML('beforeend',`<div class="modal-backdrop" id="entry-modal" role="dialog" aria-modal="true"><section class="modal"><div class="modal-top"><h2>${title}</h2><button class="modal-close" onclick="closeEntry()">×</button></div>${content}</section></div>`)};
app.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;const label=button.textContent.trim().toLowerCase();let panel='';if(label==='view budget')panel='budget';else if(label==='view all categories'||button.closest('#categories'))panel='categories';else if(label==='view full analysis')panel='analysis';else if(label==='view all'&&button.closest('#goals'))panel='goals';else if(label==='view all'&&button.closest('#bills'))panel='bills';else if(label==='view all'&&button.closest('#transactions'))panel='transactions';if(panel){event.preventDefault();openPanel(panel)}});
function series(data,max){if(!data.length)return '5,80 25,75 45,78 65,64 85,70 105,50 125,57 145,38 165,47 185,25 205,30';return data.slice(-12).map((x,i)=>`${5+i*18},${86-Math.round(x.amountMinor/max*72)}`).join(' ')}
function render(d){window.dashboardData=d;const saved=d.incomeMinor-d.spentMinor,rate=d.incomeMinor?Math.round(saved/d.incomeMinor*100):0,used=d.budgetMinor?Math.round(d.spentMinor/d.budgetMinor*100):0,limited=Math.max(0,Math.min(100,used)),remaining=d.budgetMinor===null?null:d.budgetMinor-d.spentMinor,top=Math.max(...d.categories.map(x=>x.amountMinor),1),health=Math.max(18,Math.min(96,Math.round((d.budgetMinor?(100-Math.max(0,used-100)) : 55)+(rate>0?15:0))));
const daily=d.daily||[],incomeDaily=(d.incomes||[]).map(x=>({amountMinor:x.amountMinor})),maxSeries=Math.max(...daily.map(x=>x.amountMinor),...incomeDaily.map(x=>x.amountMinor),1),expensePoints=series(daily,maxSeries),incomePoints=series(incomeDaily,maxSeries);
const cats=d.categories.slice(0,5),catKeys=cats.map((x,i)=>`<span><label><i class="dot" style="--c:${colors[i]}"></i>${esc(x.name)}</label><b>${Math.round(x.amountMinor/d.spentMinor*100)||0}%</b></span>`).join('')||'<div class="empty">No category data yet.</div>';
const tx=d.expenses.slice(0,5).map(x=>{const meta=d.expenseMetadata?.[x.id]||{};return `<tr><td>${esc(x.date)}</td><td>${esc(x.description||'Expense')}</td><td><span class="tag">${esc(x.category)}</span></td><td>${esc(meta.paymentMethod||'Expense')}</td><td class="amount">−${money(x.amountMinor,d.currency)}</td></tr>`}).join('')||'<tr><td colspan="5" class="empty">No transactions recorded.</td></tr>';
const bills=(d.recurring||[]).slice(0,3).map(x=>`<div class="compact-row"><i>◷</i><span>${esc(x.merchant||x.description||x.category)}<small>${esc(x.nextDate||'Scheduled')}</small></span><b>${money(x.amountMinor,d.currency)}</b></div>`).join('')||'<div class="empty">No upcoming recurring bills.</div>';
const insights=[d.categories[0]?`<div class="insight"><i>🍽</i><span><b>${esc(d.categories[0].name)} is your largest category</b>It represents ${Math.round(d.categories[0].amountMinor/d.spentMinor*100)}% of this month’s spending.</span></div>`:'',used>100?`<div class="insight"><i>⚠️</i><span><b>Budget limit exceeded</b>You are ${money(Math.abs(remaining),d.currency)} over your monthly budget.</span></div>`:`<div class="insight"><i>✓</i><span><b>Budget status is healthy</b>${remaining===null?'Set a monthly limit for deeper guidance.':money(remaining,d.currency)+' is still available this month.'}</span></div>`,(d.recurring||[]).length?`<div class="insight"><i>↻</i><span><b>${d.recurring.length} recurring charge${d.recurring.length>1?'s':''} tracked</b>Review your upcoming bills before they renew.</span></div>`:''].join('');
app.className='app';app.innerHTML=`<aside class="side"><div class="brand"><img src="/assets/logo/icon-512.png" alt="Expense Tracker AI"><span>Expense<em>Tracker AI</em></span></div><nav class="nav"><a href="#dashboard"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v10H3z"/><path d="M9 21v-6h6v6"/></svg><span>Dashboard</span></a><a href="#transactions"><svg viewBox="0 0 24 24"><path d="M5 3h14v18H5z"/><path d="M8 7h8M8 11h8M8 15h5"/></svg><span>Transactions</span></a><a href="#analytics"><svg viewBox="0 0 24 24"><path d="M4 19V5m0 14h16M8 15l3-4 3 2 5-7"/></svg><span>Analytics</span></a><a href="#budget"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10m3-7.5c0-1.2-1.3-2-3-2s-3 .8-3 2 1.3 2 3 2 3 .8 3 2-1.3 2-3 2-3-.8-3-2"/></svg><span>Budget</span></a><a href="#categories"><svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zm10 0h6v6h-6zM4 14h6v6H4zm10 0h6v6h-6z"/></svg><span>Categories</span></a><a href="#bills"><svg viewBox="0 0 24 24"><path d="M6 3h12l2 4v14H4V7z"/><path d="M8 11h8m-8 4h6"/></svg><span>Bills</span></a><a href="#goals"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg><span>Goals</span></a></nav><div class="streak">🔥 Saving streak<b>${rate>0?Math.max(1,Math.round(rate/2)):0} Days</b><span>${rate>0?'Keep it up! Your balance is improving.':'Add income to begin your saving streak.'}</span><div class="mini-bar"><i></i><i></i><i></i><i></i><i></i><i></i></div></div><div class="profile"><img src="/assets/logo/icon-512.png" alt=""><span><b>Private dashboard</b><small>Signed session</small></span></div></aside><section class="main" id="dashboard"><header class="top"><div class="welcome"><span class="wave">👋</span><div><h1>Good to see you</h1><p>${saved>=0?'You saved <strong>'+money(saved,d.currency)+'</strong> this month. Keep it up!':'Your private financial overview for '+esc(d.month)+'.'}</p></div></div><div class="actions"><input class="month" aria-label="Select month" type="month" value="${esc(d.month)}" onchange="location.search='month='+this.value"><input class="search" aria-label="Search dashboard" placeholder="Search anything…" oninput="filterTransactions(this.value)"><button class="button" onclick="openEntry('income')">＋ Add income</button><button class="button primary" onclick="openEntry('expense')">＋ Add expense</button><span class="notify">♧<b>3</b></span></div></header><section class="metrics"><article class="card metric hero"><span class="metric-icon">${svgIcon.wallet}</span><small>Total balance</small><b>${money(saved,d.currency)}</b><span class="badge">${rate>=0?'▲':'▼'} ${Math.abs(rate)}% &nbsp; vs last month</span><svg class="spark" viewBox="0 0 220 40" preserveAspectRatio="none"><polyline points="5,34 26,28 45,32 64,20 83,26 104,17 124,24 145,15 166,23 188,9 215,14"/></svg></article><article class="card metric" style="--stroke:#16b96c;--soft:#e4faed"><span class="metric-icon">${svgIcon.down}</span><small>Total income</small><b>${money(d.incomeMinor,d.currency)}</b><span class="badge">▲ ${rate>0?rate:0}% &nbsp; recorded this month</span><svg class="spark" viewBox="0 0 220 40" preserveAspectRatio="none"><polyline points="5,34 28,22 45,29 62,15 82,31 103,21 124,25 145,10 166,24 189,16 215,20"/></svg></article><article class="card metric" style="--stroke:#fb4a4c;--soft:#fff0f0"><span class="metric-icon">${svgIcon.up}</span><small>Total expenses</small><b>${money(d.spentMinor,d.currency)}</b><span class="badge" style="color:#ef4444;background:#fff0f0">${used>100?'▲':'▼'} ${Math.abs(used-100)}% &nbsp; vs budget</span><svg class="spark" viewBox="0 0 220 40" preserveAspectRatio="none"><polyline points="5,36 27,18 47,14 67,28 86,23 104,31 125,15 146,22 168,11 190,20 215,8"/></svg></article><article class="card metric" style="--stroke:#814df6;--soft:#f3edff"><span class="metric-icon">${svgIcon.piggy}</span><small>Total savings</small><b>${money(saved,d.currency)}</b><span class="badge" style="color:#7544e4;background:#f3edff">${rate>=0?'▲':'▼'} ${Math.abs(rate)}% &nbsp; savings rate</span><svg class="spark" viewBox="0 0 220 40" preserveAspectRatio="none"><polyline points="5,35 28,26 48,32 67,24 88,30 106,14 126,25 148,19 169,23 190,13 215,8"/></svg></article></section><section class="analysis" id="analytics"><article class="card panel"><div class="panel-head"><h2>Financial health score</h2><span>◉</span></div><div class="health"><div class="score" style="--score:${health}%"><div><b>${health}</b><small>${health>75?'Excellent':health>50?'Good':'Building'}</small></div></div><div class="health-list"><div><span>🛡 Savings rate</span><b class="ok">${rate}%</b></div><div><span>◉ Budget used</span><b>${d.budgetMinor?used+'%':'—'}</b></div><div><span>◷ Recurring bills</span><b>${(d.recurring||[]).length}</b></div><div><span>◈ Debt level</span><b class="ok">Low</b></div></div></div></article><article class="card panel"><div class="panel-head"><h2>Income vs Expense</h2><div class="legend"><span><i></i>Income</span><span><i class="red"></i>Expenses</span></div></div><div class="income-chart"><svg viewBox="0 0 220 100" preserveAspectRatio="none"><polyline class="income" points="${incomePoints}"/><polyline class="expense" points="${expensePoints}"/></svg></div><div class="legend" style="justify-content:space-between"><span>Start of month</span><span>Current month</span><span>${esc(d.month)}</span></div></article><article class="card panel" id="budget"><div class="panel-head"><h2>Budget overview</h2><button class="link" onclick="location.hash='budget'">View budget</button></div><div class="budget-gauge" style="--used:${limited}%"><div><b>${d.budgetMinor?used+'%':'—'}</b><small>${d.budgetMinor?'of budget':'no budget'}</small></div></div><div class="budget-values"><span>Spent<b>${money(d.spentMinor,d.currency)}</b></span><span>Budget<b>${d.budgetMinor?money(d.budgetMinor,d.currency):'—'}</b></span><span>Remaining<b>${remaining===null?'—':money(remaining,d.currency)}</b></span></div>${remaining!==null?`<div class="budget-alert">${remaining<0?'⚠ Budget exceeded by '+money(Math.abs(remaining),d.currency):'✓ '+money(remaining,d.currency)+' remains in your budget'}</div>`:''}</article></section><section class="lower"><article class="card panel" id="categories"><div class="panel-head"><h2>Spending by category</h2><button class="link">View all</button></div><div class="donut-row"><div class="donut"><div><b>${money(d.spentMinor,d.currency)}</b><small>Total</small></div></div><div class="category-key">${catKeys}</div></div><button class="button" style="width:100%;color:var(--blue);background:#f0f4ff;border:0">View all categories</button></article><article class="card panel"><div class="panel-head"><h2>✨ AI Insights</h2><button class="link">View full analysis</button></div><div class="insights">${insights}</div></article><div class="stack"><article class="card panel" id="goals"><div class="panel-head"><h2>Goals</h2><button class="link">View all</button></div><div class="goals"><div class="goal"><div class="goal-art">✈</div><div><b>Monthly savings goal</b><small>${money(Math.max(0,saved),d.currency)} saved this month</small><div class="progress" style="--value:${Math.min(100,Math.max(5,rate))}%"><i></i></div></div></div><div class="goal"><div class="goal-art">★</div><div><b>Budget discipline</b><small>${d.budgetMinor?used+'% of your monthly limit used':'Set a monthly target'}</small><div class="progress" style="--value:${d.budgetMinor?limited:5}%"><i></i></div></div></div></div></article><article class="card panel" id="bills"><div class="panel-head"><h2>Upcoming bills</h2><button class="link">View all</button></div><div class="compact-list">${bills}</div></article></div></section><article class="card recent" id="transactions"><div class="panel-head"><h2>Recent transactions</h2><button class="link">View all</button></div><table class="transactions"><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Payment method</th><th class="amount">Amount</th></tr></thead><tbody>${tx}</tbody></table></article></section>`}
load().then(render).catch(e=>app.innerHTML=`<h1>Dashboard unavailable</h1><p>${esc(e.message)}</p><p>Open a fresh dashboard link from Expense Tracker MCP.</p>`);
</script></body></html>
